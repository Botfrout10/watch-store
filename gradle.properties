org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# The machine-wide JAVA_HOME points at an Eclipse .p2 *JRE*, which has no
# jlink.exe. AGP 9 needs jlink to build the androidJdkImage, so pin Gradle to a
# real JDK. Change this path if you move or prune ~/.gradle/jdks.
org.gradle.java.home=C:/Users/mehdi/.gradle/jdks/eclipse_adoptium-17-amd64-windows.2

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

android.useAndroidX=true
android.nonTransitiveRClass=true